const fsBtn=$('fsBtn');
function fullscreenActive(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function updateFsButton(){const on=fullscreenActive();fsBtn.textContent=on?'⤢':'⛶';fsBtn.setAttribute('aria-label',on?'Sair da tela cheia':'Ativar tela cheia');fsBtn.title=on?'Sair da tela cheia':'Tela cheia · paisagem se compatível'}
async function toggleFullscreen(){
 try{
  if(fullscreenActive()){
   if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
   try{screen.orientation?.unlock?.()}catch(e){}
   return;
  }
  const root=document.documentElement,request=root.requestFullscreen||root.webkitRequestFullscreen;
  if(!request){fsBtn.title='Seu navegador não permite tela cheia nesta página';return}
  await request.call(root,{navigationUI:'hide'});
  if(screen.orientation?.lock){try{await screen.orientation.lock('landscape')}catch(e){fsBtn.title='Tela cheia ativa; este navegador não permitiu bloquear a orientação'}}
  updateFsButton();
 }catch(e){console.warn('Fullscreen/orientação indisponível:',e);fsBtn.title='Seu navegador não permitiu tela cheia ou orientação paisagem'}
}
fsBtn.addEventListener('click',toggleFullscreen);

const HUD_KEY='ilhaRoyaleHudV1';let hudEditorOpen=false,hudEditorTarget=null,hudDragId=null;
const hudEl=id=>document.getElementById(id);
function hudPref(){try{return JSON.parse(localStorage.getItem(HUD_KEY)||'{}')}catch(e){return{}}}
function hudClearInline(){for(const [id] of HUD_ITEMS){const e=hudEl(id);if(!e)continue;for(const k of ['left','right','top','bottom','transform','transform-origin','opacity'])e.style.removeProperty(k);e.dataset.hudScale='1';e.dataset.hudAlpha='1'}}
function applyHudLayout(){const pref=hudPref();for(const [id] of HUD_ITEMS){const e=hudEl(id),v=pref[id];if(!e)continue;if(!v){continue}const scale=Number(v.s)||1,alpha=v.a==null?1:Number(v.a);e.dataset.hudScale=scale;e.dataset.hudAlpha=alpha;e.style.transform=`scale(${scale})`;e.style.transformOrigin='center';e.style.opacity=alpha;if(Number.isFinite(v.x)&&Number.isFinite(v.y)){const w=e.offsetWidth||parseFloat(getComputedStyle(e).width)||48,h=e.offsetHeight||parseFloat(getComputedStyle(e).height)||48,cx=Math.max(w*scale/2,Math.min(innerWidth-w*scale/2,v.x*innerWidth)),cy=Math.max(h*scale/2,Math.min(innerHeight-h*scale/2,v.y*innerHeight));e.style.left=(cx-w/2)+'px';e.style.right='auto';e.style.top=(cy-h/2)+'px';e.style.bottom='auto'}}}
